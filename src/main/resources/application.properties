spring.application.name=springboot_mybatis

#数据源配置 springboot默认使用连接池是Hikari (日本一款连接池)
#连接数据库的四大元素
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/spbt_mbs
spring.datasource.username=root
spring.datasource.password=root

#mybatis配置,别名包配置
#mybatis.type-aliases-package=com.aaa.sm.entity
mybatis-plus.type-aliases-package=com.aaa.sm.entity
#控制台日志输出配置
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
#mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
#mybatis 映射文件路径配置
mybatis.mapper-locations=classpath:mapper/*.xml

#分页插件配置
# 配置方言
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true



